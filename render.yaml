# Render Blueprint: one Docker web service (website + API) and one managed PostgreSQL database.
# Step-by-step guide: docs/deploy.md
services:
  - type: web
    name: cinematch
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cinematch-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_ORIGIN
        sync: false        # Render asks for it: the site address, e.g. https://cinematch.onrender.com

databases:
  - name: cinematch-db
    plan: free
    region: singapore
    databaseName: cinematch
    user: cinematch
    postgresMajorVersion: "17"
