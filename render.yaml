# Render Blueprint: one Docker web service (website + API). The PostgreSQL database is hosted on Neon
# (free, does not expire); its connection URL is pasted into DATABASE_URL. Step-by-step guide: docs/deploy.md
services:
  - type: web
    name: cinematch
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false        # Render asks for it: the Neon connection URL (see docs/deploy.md)
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_ORIGIN
        sync: false        # Render asks for it: the site address, e.g. https://cinematch.onrender.com
