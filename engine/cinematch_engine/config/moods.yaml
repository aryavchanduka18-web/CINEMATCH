# For Tonight knowledge base (spec section 6.10): mood -> genres, or genre + keywords.
# "nearest" is the mood used when a mood has to be relaxed.
Funny:
  genres: [Comedy]
  nearest: Feel-good
Scary:
  genres: [Horror]
  genre_with_keywords:
    - genre: Thriller
      keywords: [supernatural, serial killer, haunted house, ghost, demon, possession, slasher]
  nearest: Intense
Intense:
  genres: [Thriller, Action, War, Crime]
  nearest: Mind-bending
Relaxed:
  genres: [Animation, Family, Documentary, Music]
  nearest: Feel-good
Feel-good:
  genres: [Comedy, Romance, Family, Animation, Music]
  nearest: Funny
Mind-bending:
  genres: [Science Fiction, Mystery]
  genre_with_keywords:
    - genre: Thriller
      keywords: [time travel, dream, parallel world, memory, plot twist, alternate reality, simulation]
  nearest: Intense