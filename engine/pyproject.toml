[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinematch-engine"
version = "0.1.0"
description = "Shared recommendation engine used by the CineMatch pipeline and API"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cinematch_engine*"]

[tool.setuptools.package-data]
"cinematch_engine.config" = ["*.yaml"]
