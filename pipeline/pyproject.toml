[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinematch-pipeline"
version = "0.1.0"
description = "CineMatch offline data pipeline"
requires-python = ">=3.12"
dependencies = [
    "cinematch-engine",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pillow>=10",
    "httpx>=0.27",
    "joblib>=1.4",
    "tqdm>=4.66",
    "pyyaml>=6",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "pipeline" = "." }
packages = ["pipeline"]

[tool.setuptools.package-data]
pipeline = ["curated/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]